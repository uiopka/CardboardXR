name: Build CardboardXR iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Unity CLI and Editor
        shell: bash
        run: |
          curl -fsSL https://unity.com/install.sh | bash
          export PATH="$HOME/.unity/bin:$HOME/.local/bin:$PATH"
          echo "$HOME/.unity/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          unity install 6000.6.8f1 \
            --changeset 237b6593792b \
            --module ios \
            --accept-eula \
            --non-interactive \
            --yes
          unity editors

      - name: Activate Unity license
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          test -n "$UNITY_LICENSE" || { echo "UNITY_LICENSE secret is missing"; exit 1; }
          LICENSE_FILE="$RUNNER_TEMP/Unity_lic.ulf"
          printf '%s' "$UNITY_LICENSE" > "$LICENSE_FILE"
          unity license activate --file "$LICENSE_FILE"
          unity license status

      - name: Build Xcode project via Unity batchmode
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/ios
          UNITY_BIN=$(find /Applications /Users \
            -path "*/Unity.app/Contents/MacOS/Unity" \
            -type f 2>/dev/null | head -n 1)
          test -n "$UNITY_BIN" || { echo "Unity Editor not found"; exit 1; }
          echo "Using Unity Editor: $UNITY_BIN"
          "$UNITY_BIN" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod BuildIOS.Build \
            -logFile "$GITHUB_WORKSPACE/build/unity-ios.log"

      - name: Check generated Xcode project
        if: success()
        shell: bash
        run: |
          find build -maxdepth 5 -name "*.xcodeproj" -print
          test -d build/ios/Unity-iPhone.xcodeproj

      - name: Copy Unity Editor log
        if: always()
        shell: bash
        run: |
          mkdir -p build/logs
          if [ -f "$HOME/Library/Logs/Unity/Editor.log" ]; then
            cp "$HOME/Library/Logs/Unity/Editor.log" build/logs/Editor.log
          fi

      - name: Upload Unity logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs
          path: build/**
          if-no-files-found: warn

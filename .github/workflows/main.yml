name: Build CardboardXR iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Unity CLI & Unity 6000.6.8f1 (iOS)
        run: |
          curl -fsSL https://unity.com/install.sh | bash
          export PATH="$HOME/.unity/bin:$HOME/.local/bin:$PATH"
          UNITY_CMD=$(command -v unity || find / -name "unity" -type f -perm +111 2>/dev/null | grep -E "unity-cli|unity" | head -n 1)
          echo "Using Unity CLI: $UNITY_CMD"
          "$UNITY_CMD" install --version 6000.6.8f1 --changeset 237b6593792b --module ios

      - name: Build Xcode project via Unity batchmode
        run: |
          mkdir -p build/ios
          UNITY_BIN=$(find /Applications /Users -name "Unity" -type f -path "*/Unity.app/Contents/MacOS/Unity" 2>/dev/null | head -n 1)
          echo "Using Unity Editor: $UNITY_BIN"
          "$UNITY_BIN" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$GITHUB_WORKSPACE" \
            -executeMethod BuildIOS.Build \
            -logFile "$GITHUB_WORKSPACE/build/unity-ios.log"

      - name: Archive Xcode project
        run: |
          mkdir -p build/archive build/output
          XCODE_PROJ=$(find build/ios -maxdepth 2 -name "Unity-iPhone.xcodeproj" | head -n 1)
          echo "Found project: $XCODE_PROJ"
          xcodebuild -project "$XCODE_PROJ" \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/archive/CardboardXR.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CardboardXR-iOS-Build
          path: |
            build/archive/**
            build/unity-ios.log
          if-no-files-found: ignore

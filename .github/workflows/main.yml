name: Build CardboardXR iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Unity CLI & check install flags
        run: |
          curl -fsSL https://unity.com/install.sh | bash
          export PATH="$HOME/.unity/bin:$HOME/.local/bin:$PATH"
          "$HOME/.unity/bin/unity" install --help

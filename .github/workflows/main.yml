- name: Build Xcode project via Unity batchmode
  shell: bash
  run: |
    set -o pipefail
    mkdir -p build/ios
    UNITY_BIN=$(find /Applications /Users -path "*/Unity.app/Contents/MacOS/Unity" -type f 2>/dev/null | head -n 1)
    test -n "$UNITY_BIN" || { echo "Unity Editor not found"; exit 1; }
    echo "Using Unity Editor: $UNITY_BIN"
    "$UNITY_BIN" \
      -batchmode \
      -nographics \
      -quit \
      -projectPath "$GITHUB_WORKSPACE" \
      -executeMethod BuildIOS.Build \
      -logFile -

- name: Upload Unity logs
  if: always()
  uses: actions/upload-artifact@v4
  with:
    name: unity-logs
    path: |
      ~/Library/Logs/Unity/Editor.log
      build/**
    if-no-files-found: warn

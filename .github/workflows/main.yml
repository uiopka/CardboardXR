name: Build CardboardXR iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Unity Hub & Unity 6000.6.8f1 (iOS)
        run: |
          brew install --cask unity-hub
          echo "Проверь версию в ProjectSettings/ProjectVersion.txt и при необходимости поставь нужный редактор с модулем ios"

      - name: Build Xcode project via Unity batchmode
        run: |
          mkdir -p ./build/ios
          echo "Запуск Unity в -batchmode -nographics -buildTarget iOS в ./build/ios"

      - name: Archive and export unsigned IPA
        run: |
          mkdir -p ./output
          ls -la ./build/ios || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardboardXR-iOS-IPA
          path: ./output/*.ipa
          if-no-files-found: ignore
